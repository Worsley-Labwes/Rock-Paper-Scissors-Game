<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to Rock-Paper-Scissors Game!</h1> 
    <div class="choices">    
       <button onclick="playGame('rock')">👊</button>
       <button onclick="playGame('paper')">✋</button>
       <button onclick="playGame('scissors')">✌️</button>
    </div>   
    <div id="playerDisplay">Player:</div>
    <div id="computerDisplay">Computer:</div>
    <div id="resultDisplay">ITS A TIE</div>  

    <div class="scoreContainer">
        <div class="scoreDisplay">Player Score: <span id="playerScoreDisplay">0</span></div>
        <div class="scoreDisplay">Computer Score: <span id="computerScoreDisplay">0</span></div>
    </div>

    <button id="resetButton">Reset Scores</button>

    <footer>
        <p>© 2026 . All rights reserved. Designed & Developed by Wesley</p>        
    </footer>

    

   <script src="index.js"></script>    
</body>
</html>
